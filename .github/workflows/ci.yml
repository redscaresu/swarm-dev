name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Least-privilege default: every job only reads the repo.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04   # ubuntu-26.04 (uutils coreutils) breaks the stub binaries; see story ci-on-ubuntu-26
    permissions:
      contents: read
      checks: read     # the gate reads main's check runs for a release PR
      statuses: read   # and its commit statuses
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate diffs against the PR's base
          persist-credentials: false
      - name: Gate a board-only or version-only PR
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # The base's copy when it has one: a PR is never judged by a gate it changed.
        run: |
          git show "${BASE_SHA}:scripts/board-only.sh" > "${RUNNER_TEMP}/board-only.sh" || cp scripts/board-only.sh "${RUNNER_TEMP}/board-only.sh"
          bash "${RUNNER_TEMP}/board-only.sh"
      - name: Run shellcheck
        if: steps.gate.outputs.board_only != 'true'
        # shellcheck is preinstalled on GitHub's ubuntu runners.
        run: shellcheck bin/swarm.sh bin/lib/*.sh scripts/pre-commit scripts/demo-dash.sh scripts/board-only.sh scripts/test.sh tests/*.sh

  test:
    runs-on: ubuntu-24.04   # ubuntu-26.04 (uutils coreutils) breaks the stub binaries; see story ci-on-ubuntu-26
    permissions:
      contents: read
      checks: read     # the gate reads main's check runs for a release PR
      statuses: read   # and its commit statuses
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate diffs against the PR's base
          persist-credentials: false
      - name: Gate a board-only or version-only PR
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # The base's copy when it has one: a PR is never judged by a gate it changed.
        run: |
          git show "${BASE_SHA}:scripts/board-only.sh" > "${RUNNER_TEMP}/board-only.sh" || cp scripts/board-only.sh "${RUNNER_TEMP}/board-only.sh"
          bash "${RUNNER_TEMP}/board-only.sh"
      - name: Compile bin/lib/*.py
        if: steps.gate.outputs.board_only != 'true'
        run: python3 -m py_compile bin/lib/*.py
      - name: Run every tests/*_test.sh (make test)
        if: steps.gate.outputs.board_only != 'true'
        run: make test

  plugin-validate:
    runs-on: ubuntu-24.04   # ubuntu-26.04 (uutils coreutils) breaks the stub binaries; see story ci-on-ubuntu-26
    permissions:
      contents: read
      checks: read     # the gate reads main's check runs for a release PR
      statuses: read   # and its commit statuses
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate diffs against the PR's base
          persist-credentials: false
      - name: Gate a board-only or version-only PR
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # The base's copy when it has one: a PR is never judged by a gate it changed.
        run: |
          git show "${BASE_SHA}:scripts/board-only.sh" > "${RUNNER_TEMP}/board-only.sh" || cp scripts/board-only.sh "${RUNNER_TEMP}/board-only.sh"
          bash "${RUNNER_TEMP}/board-only.sh"
      - name: Validate the plugin and marketplace manifests
        if: steps.gate.outputs.board_only != 'true'
        # Pinned Claude Code release, fetched ephemerally; validation is offline.
        run: npx --yes @anthropic-ai/claude-code@2.1.284 plugin validate .

  gitleaks:
    runs-on: ubuntu-24.04   # ubuntu-26.04 (uutils coreutils) breaks the stub binaries; see story ci-on-ubuntu-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --source=. --config .gitleaks.toml
