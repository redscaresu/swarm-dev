# swarm-dev wrote this file with swarm.sh init; delete it and run init again to rewrite it.
name: CI

on:
  pull_request:
  push:
    branches: ["@BRANCH@"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate diffs against the base
          persist-credentials: false
      # swarm-dev: a change to only the board's own files skips the checks.
      - name: Skip a board-only change
        id: gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/swarm-board-only.sh
      - name: make check
        if: steps.gate.outputs.board_only != 'true'
        run: |
          make -n check >/dev/null 2>&1 || { echo "::error::make has no check target; add one to the Makefile for CI to run"; exit 1; }
          make check
